<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cin düğünü</title>
    <link rel="icon" href="./favicon.png" type="image/png">
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "mert kadir çataloğlu",
      "jobTitle": "yazar",
      "description": "fragmanlar ve monologlar üzerine odaklanan yazar",
      "url": "http://www.mertkadircatalogu.org",
      "mainEntityOfPage": "http://www.mertkadircatalogu.org",
      "knowsAbout": ["edebiyat", "monologlar", "fragmanlar", "felsefe"]
    }
    </script>

    <style>
        /* İkinci fotoğraftaki o kaskatı, simsiyah nizamın birebir CSS kodları ulan! */
        body { 
            font-family: monospace !important; 
            font-size: 16px; 
            font-weight: 900 !important; /* Her harfi birer dökme demir gibi kalın yapar! */
            background: #fff; 
            color: #000 !important; 
            padding: 40px; 
            line-height: 1.6; 
            text-transform: lowercase !important; /* Büyük harflere ebediyen ölüm! */
        }
        
        /* Paragrafların o gereksiz sağa kaymasını felç eden, sola yaslayan net blok */
        #icerik { 
            max-width: 100%; /* Sola tam yaslansın, genişlesin ulan! */
            margin: 0; 
            text-align: left;
        }

        /* .md içinden çıkan tüm etiketleri (p, li vb.) kaskatı kalın yapmak için mühür */
        #icerik p, #icerik {
            font-weight: 900 !important;
            color: #000 !important;
        }

        /* İkinci fotoğraftaki o şanlı, kalın alt çizgili başlığın milimetrik ikizi */
        #icerik h1 {
            font-family: monospace !important;
            font-weight: 900 !important;
            display: inline-block;
            text-decoration: underline !important;
            text-decoration-thickness: 5px !important; /* O şanlı 5 piksellik çelik çizgi! */
            text-underline-offset: 10px !important;
            color: #000 !important;
            margin-top: 0;
            margin-bottom: 30px;
            padding-bottom: 2px;
            font-size: 2em;
        }
    </style>
</head>
<body>

    <div id="icerik">yazı yükleniyor ulan...</div>

    <script>
        // Repondaki o şanlı .md dosyasının adı
        const mdDosyasi = 'deli-doktoru.md'; 

        fetch(mdDosyasi)
            .then(response => response.text())
            .then(markdownMetni => {
                // Markdown'ı saniyeler içinde temiz HTML'e çevirip div'e çakıyor!
                document.getElementById('icerik').innerHTML = marked.parse(markdownMetni);
            })
            .catch(err => {
                document.getElementById('icerik').innerHTML = 'hata, yazı yüklenmedi';
                console.error(err);
            });
    </script>

</body>
</html>
